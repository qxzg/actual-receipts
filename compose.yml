name: receipt-ledger

services:
  receipt-app:
    image: receipt-ledger-app:local
    build:
      context: .
      target: app
    restart: unless-stopped
    init: true
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
    memswap_limit: 768m
    pids_limit: 128
    ports:
      - "127.0.0.1:${PUBLIC_PORT:-3100}:3100"
    environment:
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3100}
      HOST: 0.0.0.0
      PORT: 3100
      DATA_DIR: /data
      MASTER_KEY_FILE: /run/secrets/master-key
      PROVIDER_TOKEN_FILE: /run/secrets/provider-token
      PROVIDER_URL: http://codex-provider:3101
      TRUSTED_PROXY: ${TRUSTED_PROXY:-}
      NODE_OPTIONS: --max-old-space-size=220
    volumes:
      - receipt-data:/data
    secrets: [master-key, provider-token]
    tmpfs: ["/tmp:size=64m,mode=1777"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [internal, outbound]
    depends_on:
      codex-provider:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3100/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: &logging
      driver: json-file
      options: {max-size: 5m, max-file: "3"}

  codex-provider:
    image: receipt-ledger-provider:local
    build:
      context: .
      target: provider
    restart: unless-stopped
    init: true
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 96
    environment:
      PORT: 3101
      CODEX_HOME: /data/codex
      PROVIDER_TOKEN_FILE: /run/secrets/provider-token
      NODE_OPTIONS: --max-old-space-size=180
    volumes:
      - codex-data:/data/codex
    secrets: [provider-token]
    tmpfs: ["/tmp:size=64m,mode=1777"]
    networks: [internal, outbound]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3101/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *logging

networks:
  internal:
    internal: true
  outbound: {}

volumes:
  receipt-data:
  codex-data:

secrets:
  master-key:
    file: ./secrets/master-key
  provider-token:
    file: ./secrets/provider-token
